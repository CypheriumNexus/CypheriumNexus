<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">CypheriumNexus — Neural Pulse Lattice</title>
  <desc id="desc">An animated network lattice representing cybersecurity, digital forensics, network security, and technical development.</desc>
  <defs>
    <!-- The same fifteen edge paths drive both the visible network and moving signals. -->
    <path id="np-e1" d="M120 80 L240 140"/><path id="np-e2" d="M120 80 L180 250"/>
    <path id="np-e3" d="M240 140 L180 250"/><path id="np-e4" d="M240 140 L340 80"/>
    <path id="np-e5" d="M240 140 L450 140"/><path id="np-e6" d="M180 250 L340 220"/>
    <path id="np-e7" d="M340 80 L450 140"/><path id="np-e8" d="M340 80 L560 90"/>
    <path id="np-e9" d="M340 220 L450 140"/><path id="np-e10" d="M340 220 L520 250"/>
    <path id="np-e11" d="M450 140 L640 180"/><path id="np-e12" d="M560 90 L640 180"/>
    <path id="np-e13" d="M520 250 L640 180"/><path id="np-e14" d="M520 250 L620 320"/>
    <path id="np-e15" d="M640 180 L620 320"/>
    <radialGradient id="halo-blue"><stop offset="0" stop-color="#4fbcff" stop-opacity=".85"/><stop offset=".4" stop-color="#4fbcff" stop-opacity=".18"/><stop offset="1" stop-color="#4fbcff" stop-opacity="0"/></radialGradient>
    <radialGradient id="halo-violet"><stop offset="0" stop-color="#a78bfa" stop-opacity=".85"/><stop offset=".4" stop-color="#a78bfa" stop-opacity=".18"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fbcff" stop-opacity="0"/><stop offset=".5" stop-color="#4fbcff" stop-opacity=".07"/><stop offset="1" stop-color="#4fbcff" stop-opacity="0"/></linearGradient>
    <filter id="pulse-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="2.4"/></filter>
  </defs>

  <rect width="1200" height="420" fill="#050810"/>
  <!-- Subtle technical grid -->
  <g stroke="#0e1a30" stroke-width=".5">
    <path d="M0 60H780 M0 140H780 M0 220H780 M0 300H780"/>
    <path d="M80 0V420 M200 0V420 M320 0V420 M440 0V420 M560 0V420 M680 0V420"/>
  </g>
  <rect width="780" height="120" y="-120" fill="url(#scan)" opacity=".75"><animate attributeName="y" values="-120;420;-120" dur="11s" repeatCount="indefinite"/></rect>

  <!-- Network edges -->
  <g stroke="#1a2a4a" stroke-width="1" fill="none" opacity=".95">
    <use xlink:href="#np-e1"/><use xlink:href="#np-e2"/><use xlink:href="#np-e3"/><use xlink:href="#np-e4"/><use xlink:href="#np-e5"/>
    <use xlink:href="#np-e6"/><use xlink:href="#np-e7"/><use xlink:href="#np-e8"/><use xlink:href="#np-e9"/><use xlink:href="#np-e10"/>
    <use xlink:href="#np-e11"/><use xlink:href="#np-e12"/><use xlink:href="#np-e13"/><use xlink:href="#np-e14"/><use xlink:href="#np-e15"/>
  </g>

  <!-- Ten breathing nodes; two warm hubs anchor the graph. -->
  <g>
    <g><circle cx="120" cy="80" r="14" fill="url(#halo-blue)"><animate attributeName="r" values="14;22;14" dur="3.4s" repeatCount="indefinite"/></circle><circle cx="120" cy="80" r="3.4" fill="#4fbcff"/></g>
    <g><circle cx="240" cy="140" r="14" fill="url(#halo-blue)"><animate attributeName="r" values="14;22;14" dur="2.8s" begin=".4s" repeatCount="indefinite"/></circle><circle cx="240" cy="140" r="3.4" fill="#4fbcff"/></g>
    <g><circle cx="180" cy="250" r="14" fill="url(#halo-violet)"><animate attributeName="r" values="14;22;14" dur="3.6s" begin=".9s" repeatCount="indefinite"/></circle><circle cx="180" cy="250" r="3.4" fill="#a78bfa"/></g>
    <g><circle cx="340" cy="80" r="14" fill="url(#halo-blue)"><animate attributeName="r" values="14;22;14" dur="3.1s" begin="1.4s" repeatCount="indefinite"/></circle><circle cx="340" cy="80" r="3.4" fill="#4fbcff"/></g>
    <g><circle cx="340" cy="220" r="14" fill="url(#halo-violet)"><animate attributeName="r" values="14;22;14" dur="2.9s" begin=".2s" repeatCount="indefinite"/></circle><circle cx="340" cy="220" r="3.4" fill="#a78bfa"/></g>
    <g><circle cx="450" cy="140" r="20" fill="url(#halo-blue)"><animate attributeName="r" values="18;28;18" dur="2.4s" repeatCount="indefinite"/></circle><circle cx="450" cy="140" r="5" fill="#fef3c7"/></g>
    <g><circle cx="560" cy="90" r="14" fill="url(#halo-blue)"><animate attributeName="r" values="14;22;14" dur="3.3s" begin="1.7s" repeatCount="indefinite"/></circle><circle cx="560" cy="90" r="3.4" fill="#4fbcff"/></g>
    <g><circle cx="520" cy="250" r="14" fill="url(#halo-violet)"><animate attributeName="r" values="14;22;14" dur="3.5s" begin=".7s" repeatCount="indefinite"/></circle><circle cx="520" cy="250" r="3.4" fill="#a78bfa"/></g>
    <g><circle cx="640" cy="180" r="18" fill="url(#halo-blue)"><animate attributeName="r" values="16;26;16" dur="2.6s" begin=".5s" repeatCount="indefinite"/></circle><circle cx="640" cy="180" r="4.6" fill="#fef3c7"/></g>
    <g><circle cx="620" cy="320" r="14" fill="url(#halo-blue)"><animate attributeName="r" values="14;22;14" dur="3.2s" begin="1.1s" repeatCount="indefinite"/></circle><circle cx="620" cy="320" r="3.4" fill="#4fbcff"/></g>
  </g>

  <!-- Nine independent signal pulses, deliberately desynchronized. -->
  <g filter="url(#pulse-glow)">
    <circle r="3.2" fill="#7ddbff"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath xlink:href="#np-e1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.8s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#7ddbff"><animateMotion dur="2.4s" begin=".6s" repeatCount="indefinite"><mpath xlink:href="#np-e5"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin=".6s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#c4b5fd"><animateMotion dur="2s" begin=".2s" repeatCount="indefinite"><mpath xlink:href="#np-e6"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2s" begin=".2s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#7ddbff"><animateMotion dur="1.6s" begin="1s" repeatCount="indefinite"><mpath xlink:href="#np-e7"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.6s" begin="1s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#7ddbff"><animateMotion dur="2.2s" begin=".4s" repeatCount="indefinite"><mpath xlink:href="#np-e8"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.2s" begin=".4s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#c4b5fd"><animateMotion dur="2.6s" begin=".8s" repeatCount="indefinite"><mpath xlink:href="#np-e10"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.6s" begin=".8s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#fef3c7"><animateMotion dur="1.7s" begin=".3s" repeatCount="indefinite"><mpath xlink:href="#np-e11"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="1.7s" begin=".3s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#7ddbff"><animateMotion dur="2s" begin="1.4s" repeatCount="indefinite"><mpath xlink:href="#np-e13"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle r="3.2" fill="#c4b5fd"><animateMotion dur="2.4s" begin=".5s" repeatCount="indefinite"><mpath xlink:href="#np-e15"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="2.4s" begin=".5s" repeatCount="indefinite"/></circle>
  </g>

  <line x1="800" y1="40" x2="800" y2="380" stroke="#1a2a4a" stroke-width=".8"/>
  <!-- Identity and profile information panel -->
  <g font-family="'JetBrains Mono','IBM Plex Mono',ui-monospace,monospace" fill="#a5b4cf">
    <text x="840" y="68" font-size="10" letter-spacing="3.2" fill="#4fbcff">CYIPHERIUM / NEXUS</text>
    <text x="840" y="87" font-size="9" letter-spacing="2.5" fill="#7185a8">SECURITY RESEARCH · TECHNICAL DEVELOPMENT</text>
    <text x="840" y="139" font-family="'Space Grotesk',system-ui,sans-serif" font-size="32" font-weight="700" fill="#fef3c7" letter-spacing="-.7">CypheriumNexus</text>
    <text x="840" y="163" font-size="9.5" letter-spacing="1.3" fill="#4fbcff">CYBERSECURITY · DIGITAL FORENSICS</text>
    <text x="840" y="179" font-size="9.5" letter-spacing="1.3" fill="#4fbcff">NETWORK SECURITY · PROGRAMMING</text>
    <line x1="840" y1="196" x2="1145" y2="196" stroke="#1a2a4a" stroke-width=".8"/>
    <g font-size="10.5">
      <text x="840" y="220">EDUCATION</text><text x="965" y="220" fill="#fef3c7">A.A.S. COMPUTER TECH</text>
      <text x="840" y="243">EMPHASIS</text><text x="965" y="243" fill="#fef3c7">CYBERSECURITY / FORENSICS</text>
      <text x="840" y="266">GRADUATION</text><text x="965" y="266" fill="#fef3c7">SPRING 2027</text>
      <text x="840" y="289">TOOLKIT</text><text x="965" y="289" fill="#fef3c7">WIRESHARK · AUTOPSY · FTK</text>
      <text x="840" y="312">FOCUS</text><text x="965" y="312" fill="#fef3c7">THREAT INTEL · OSINT</text>
    </g>
    <line x1="840" y1="333" x2="1145" y2="333" stroke="#1a2a4a" stroke-width=".8"/>
    <text x="840" y="357" font-size="9.5" letter-spacing="2.2" fill="#4fbcff">TRANSMISSION / OPEN CHANNEL</text>
    <text x="840" y="375" font-size="10" fill="#a5b4cf">github.com/CypheriumNexus</text>
  </g>
  <!-- Status indicator -->
  <g transform="translate(40 380)" font-family="'JetBrains Mono',monospace" font-size="8.5" letter-spacing="2.2">
    <circle cx="6" cy="-3" r="3.5" fill="#4ade80"><animate attributeName="opacity" values=".35;1;.35" dur="1.6s" repeatCount="indefinite"/></circle>
    <text x="20" y="0" fill="#8da2c5">SYSTEM NOMINAL · 10 NODES · 15 EDGES · 9 SIGNALS IN FLIGHT</text>
  </g>
</svg>
